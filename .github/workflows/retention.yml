name: Data retention

# Nightly, at 03:20 UTC. Off the hour on purpose: everything else in the world runs at
# :00, and this competes for the same Burstable database credits as real traffic.
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce retention periods
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://reviewmaster-app.azurewebsites.net/api/cron/retention)
          cat /tmp/out.json
          echo
          if [ "$code" != "200" ]; then
            echo "Retention run failed with HTTP $code"
            exit 1
          fi
