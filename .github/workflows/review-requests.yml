name: Review request sender

# The hourly schedule now lives in Azure, not here.
#
# GitHub's cron is best-effort and behaved like it: on 14 August this job missed two
# consecutive ticks, and the two daily workflows both ran about 4h40m late. The sweep is
# the product's core loop, so it moved to an Azure Logic App, which has since fired at
# :40:25 three hours running. See infra/README.md.
#
# workflow_dispatch stays. Running it by hand is still useful, and the sweep claims rows
# atomically, so a manual run alongside the Logic App cannot double-send.
on:
  # schedule:
  #   - cron: '40 * * * *'   # replaced by the Azure Logic App reviewmaster-review-requests
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep due review requests
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://reviewmaster-app.azurewebsites.net/api/cron/review-requests)
          cat /tmp/out.json
          echo
          if [ "$code" != "200" ]; then
            echo "Sweep failed with HTTP $code"
            exit 1
          fi
