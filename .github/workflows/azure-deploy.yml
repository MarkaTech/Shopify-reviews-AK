name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: reviewmaster-app      # Your Azure Web App name
  AZURE_RESOURCE_GROUP: reviewmaster-rg    # Resource group holding the Web App
  REGISTRY: ghcr.io                        # GitHub Container Registry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect DATABASE_URL secret
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "HAS_DB_URL=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DB_URL=false" >> "$GITHUB_ENV"
          fi

      # ---- Normalise the image name ----
      # ${{ github.repository }} preserves the owner/repo casing, but Docker image
      # references must be entirely lowercase. Deploying "ghcr.io/MarkaTech/Shopify-Review-App"
      # fails the pull. Compute a lowercase name once and reuse it in both steps below.
      - name: Compute lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # ---- Login to GitHub Container Registry ----
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Extract metadata for Docker ----
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.sha }}

      # ---- Build and push Docker image ----
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ---- Apply the Prisma schema to production BEFORE the new code ships ----
      # Two problems this solves at once:
      #   1. Ordering. New code reading a column that does not exist yet crashes; the old
      #      code ignoring a new column does not. Schema first, deploy second, always.
      #   2. Reachability. Schema pushes used to run from a laptop whose IP changed every
      #      few days, so every deploy involving a migration began with a firewall visit.
      #      GitHub-hosted runners are Azure VMs, so they pass the server's existing
      #      "allow Azure services" rule, and no laptop is involved at all.
      # Skipped quietly when the secret is absent, so forks and secretless checkouts
      # still deploy code-only changes.
      # Migrations, not `db push --accept-data-loss`.
      #
      # What was here ran `prisma db push --accept-data-loss` against production on every
      # push to main. `db push` is a prototyping tool: it reshapes the database to match
      # the schema file with no history and no review, and `--accept-data-loss` turns its
      # one safety feature — refusing a destructive change — into silent execution. A
      # renamed field or a narrowed type would have dropped the column and its contents
      # mid-deploy, with the only record being a line in a CI log. `workflow_dispatch`
      # carries no branch restriction either, so it was dispatchable from any ref.
      #
      # `migrate deploy` applies committed migration files in order and applies nothing
      # else. A schema change is now a reviewable diff in the pull request, a destructive
      # one is visible as SQL before it runs, and the sequence that reached production is
      # recorded in _prisma_migrations rather than inferred.
      #
      # It also fails closed: a migration that errors stops the step, so the new image is
      # never deployed against a half-migrated database.
      - name: Apply database migrations
        if: ${{ env.HAS_DB_URL == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install --no-save prisma@6.19.3 >/dev/null 2>&1
          npx prisma migrate deploy
      - name: Check for DATABASE_URL secret
        if: ${{ always() }}
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::warning::DATABASE_URL secret is not set - schema was NOT pushed. Set it in repo Settings -> Secrets."
          fi

      # ---- Login to Azure ----
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---- Give Azure credentials to pull from GHCR ----
      # The GHCR package is private by default. Without these settings the Web App gets a
      # 401 on pull and silently keeps serving the previous (or placeholder) image.
      - name: Configure Web App registry credentials
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings \
              DOCKER_REGISTRY_SERVER_URL=https://${{ env.REGISTRY }} \
              DOCKER_REGISTRY_SERVER_USERNAME=${{ github.actor }} \
              DOCKER_REGISTRY_SERVER_PASSWORD=${{ secrets.GITHUB_TOKEN }} \
            --output none

      # ---- Deploy to Azure Web App (Containers) ----
      # Tag must match one metadata-action actually published. type=sha emits
      # "sha-<7 chars>", never the bare 40-character SHA — the previous value here pointed
      # at a tag that never existed, so every deploy failed to pull. We now publish
      # type=raw,value=${{ github.sha }} above so this reference resolves.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          container-type: custom

      # ---- Smoke test ----
      - name: Verify the app responds
        run: |
          echo "Waiting for the container to come up..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "App is responding."
              exit 0
            fi
            sleep 10
          done
          echo "App did not return a healthy status within 5 minutes."
          exit 1
