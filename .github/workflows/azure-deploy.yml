name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: reviewmaster-app      # Your Azure Web App name
  AZURE_RESOURCE_GROUP: reviewmaster-rg    # Resource group holding the Web App
  REGISTRY: ghcr.io                        # GitHub Container Registry
  AZURE_PG_SERVER: reviewmaster-db-server  # Postgres Flexible Server holding the app database

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Gate: typecheck and tests ----
      #
      # These existed and were green, and nothing ever ran them. The pipeline went
      # checkout -> docker build -> deploy, so `tsc` and the four test files gated
      # precisely nothing, and next.config.ts's `ignoreBuildErrors: false` was the only
      # thing standing between a type error and production.
      #
      # Placed before the image build so a failure costs seconds rather than a full
      # multi-stage Docker build, and so a broken commit never produces a pushed image.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      # Each file as a script, NOT `bun test tests/`.
      #
      # These suites do not use bun's test API — they build their own `tests` array, run it,
      # and `process.exit(1)` on a failure. `bun test` discovers no test cases in them and
      # reports "Ran 0 tests" with a success exit code, so wiring CI up that way would have
      # produced a green check that asserted nothing. Running them as scripts is what
      # actually surfaces the exit code.
      - name: Test
        run: |
          for f in tests/*.test.ts; do
            echo "── $f"
            bun run "$f"
          done

      - name: Detect DATABASE_URL secret
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "HAS_DB_URL=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DB_URL=false" >> "$GITHUB_ENV"
          fi

      # ---- Normalise the image name ----
      # ${{ github.repository }} preserves the owner/repo casing, but Docker image
      # references must be entirely lowercase. Deploying "ghcr.io/MarkaTech/Shopify-Review-App"
      # fails the pull. Compute a lowercase name once and reuse it in both steps below.
      - name: Compute lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # ---- Login to GitHub Container Registry ----
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Extract metadata for Docker ----
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.sha }}

      # ---- Build and push Docker image ----
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ---- Apply the Prisma schema to production BEFORE the new code ships ----
      # Two problems this solves at once:
      #   1. Ordering. New code reading a column that does not exist yet crashes; the old
      #      code ignoring a new column does not. Schema first, deploy second, always.
      #   2. Reachability. Schema pushes used to run from a laptop whose IP changed every
      #      few days, so every deploy involving a migration began with a firewall visit.
      #      GitHub-hosted runners are Azure VMs, so they pass the server's existing
      #      "allow Azure services" rule, and no laptop is involved at all.
      # Skipped quietly when the secret is absent, so forks and secretless checkouts
      # still deploy code-only changes.
      # Migrations, not `db push --accept-data-loss`.
      #
      # What was here ran `prisma db push --accept-data-loss` against production on every
      # push to main. `db push` is a prototyping tool: it reshapes the database to match
      # the schema file with no history and no review, and `--accept-data-loss` turns its
      # one safety feature — refusing a destructive change — into silent execution. A
      # renamed field or a narrowed type would have dropped the column and its contents
      # mid-deploy, with the only record being a line in a CI log. `workflow_dispatch`
      # carries no branch restriction either, so it was dispatchable from any ref.
      #
      # `migrate deploy` applies committed migration files in order and applies nothing
      # else. A schema change is now a reviewable diff in the pull request, a destructive
      # one is visible as SQL before it runs, and the sequence that reached production is
      # recorded in _prisma_migrations rather than inferred.
      #
      # It also fails closed: a migration that errors stops the step, so the new image is
      # never deployed against a half-migrated database.
      # ---- Login to Azure ----
      #
      # Moved AHEAD of the migration step. It used to sit after it, which was fine only
      # because the database carried Azure's blanket "allow all Azure services" firewall
      # rule (0.0.0.0) — GitHub-hosted runners are Azure VMs, so they slipped through it.
      #
      # That rule admits every VM in every Azure tenant to port 5432, so the leaked admin
      # credential needed no network foothold at all. Removing it is the fix, but removing
      # it with the old ordering would have broken `migrate deploy` on every deploy. Hence
      # this: log in first, open a firewall rule for THIS runner's address only, migrate,
      # then close it again.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---- Open the database to this runner, and only this runner ----
      - name: Open database firewall for this run
        id: dbfw
        if: ${{ env.HAS_DB_URL == 'true' }}
        run: |
          RUNNER_IP="$(curl -sf --retry 3 https://api.ipify.org)"
          if [ -z "$RUNNER_IP" ]; then
            echo "::error::could not determine the runner's public IP; refusing to open the firewall"
            exit 1
          fi
          RULE="gha-${GITHUB_RUN_ID}"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
          echo "Opening $RULE for $RUNNER_IP"
          # `--server-name` for the server and `--name` for the rule. There is no
          # `--rule-name` on this command, and `--name` alone means the RULE, not the
          # server — getting that backwards is what failed run 34117005433.
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server-name "${{ env.AZURE_PG_SERVER }}" \
            --name "$RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Apply database migrations
        if: ${{ env.HAS_DB_URL == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install --no-save prisma@6.19.3 >/dev/null 2>&1
          # First run against a database that predates migration history fails with
          # P3005 ("schema is not empty"): the tables exist from the db-push era but
          # _prisma_migrations does not, and migrate deploy refuses to guess. The
          # documented baseline flow: run the (idempotent - every statement is
          # IF NOT EXISTS) migration SQL directly, then record it as applied. That
          # creates the history table; every later run takes the normal path above.
          if ! npx prisma migrate deploy; then
            echo "migrate deploy failed - attempting one-time baseline (P3005 path)"
            # 0_init describes the tables that already exist from the db-push era, so it is
            # recorded as applied WITHOUT running it. Running it would be harmless (every
            # statement is CREATE TABLE, which would error on existing tables) but pointless:
            # the point of a baseline is to tell Prisma "this state is already here".
            npx prisma migrate resolve --applied 0_init
            npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260810120000_import_key_and_grant_uniqueness/migration.sql
            npx prisma migrate resolve --applied 20260810120000_import_key_and_grant_uniqueness
            npx prisma migrate deploy
          fi
      # `always()`, so a failed migration still closes the hole it opened. Tolerant of a
      # delete that fails: a leftover single-IP rule for a dead runner is untidy, not
      # dangerous, and failing the deploy over cleanup would be worse.
      - name: Close database firewall
        if: ${{ always() && steps.dbfw.outputs.rule != '' }}
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server-name "${{ env.AZURE_PG_SERVER }}" \
            --name "${{ steps.dbfw.outputs.rule }}" \
            --yes --output none || echo "::warning::could not remove firewall rule ${{ steps.dbfw.outputs.rule }}"

      - name: Check for DATABASE_URL secret
        if: ${{ always() }}
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::warning::DATABASE_URL secret is not set - schema was NOT pushed. Set it in repo Settings -> Secrets."
          fi

      # ---- Give Azure credentials to pull from GHCR ----
      # The GHCR package is private by default. Without these settings the Web App gets a
      # 401 on pull and silently keeps serving the previous (or placeholder) image.
      - name: Configure Web App registry credentials
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings \
              DOCKER_REGISTRY_SERVER_URL=https://${{ env.REGISTRY }} \
              DOCKER_REGISTRY_SERVER_USERNAME=${{ github.actor }} \
              DOCKER_REGISTRY_SERVER_PASSWORD=${{ secrets.GITHUB_TOKEN }} \
            --output none

      # ---- Deploy to Azure Web App (Containers) ----
      # Tag must match one metadata-action actually published. type=sha emits
      # "sha-<7 chars>", never the bare 40-character SHA — the previous value here pointed
      # at a tag that never existed, so every deploy failed to pull. We now publish
      # type=raw,value=${{ github.sha }} above so this reference resolves.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          container-type: custom

      # ---- Smoke test ----
      - name: Verify the app responds
        run: |
          echo "Waiting for the container to come up..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "App is responding."
              exit 0
            fi
            sleep 10
          done
          echo "App did not return a healthy status within 5 minutes."
          exit 1
